name: devloop
on:
  push:
    branches: ['xfer-harf']
permissions:
  contents: write
jobs:
  loop:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          mkdir -p ci-out
          { sw_vers; xcodebuild -version; swift --version; } > ci-out/toolchain.txt 2>&1 || true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate > ci-out/xcodegen.log 2>&1
      - name: Test
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -scheme Harf -destination 'platform=macOS' -resultBundlePath build/Tests.xcresult test > ci-out/test.log 2>&1
          echo "exit=$?" > ci-out/test-exit.txt
      - name: Test summary
        if: always()
        run: |
          [ -f ci-out/test-exit.txt ] || echo "exit=failed" > ci-out/test-exit.txt
          xcrun xcresulttool get test-results summary --path build/Tests.xcresult > ci-out/test-summary.json 2>&1 || true
          xcrun xcresulttool get test-results tests --path build/Tests.xcresult > ci-out/test-tests.json 2>&1 || true
          grep -E "error:|warning:" ci-out/test.log | grep -v "^ld: warning: ignoring duplicate" | sort -u > ci-out/diagnostics.txt || true
          grep -E "XCTAssert|failed \(" ci-out/test.log | head -200 > ci-out/test-failures.txt || true
          tail -40 ci-out/test.log > ci-out/test-tail.txt || true
      - name: Release build
        continue-on-error: true
        run: |
          set -o pipefail
          ./scripts/build-release.sh > ci-out/build.log 2>&1
          echo "exit=$?" > ci-out/build-exit.txt
      - name: Check release and render assets from it
        if: always()
        run: |
          grep -E "error:|warning:" ci-out/build.log | sort -u > ci-out/build-diagnostics.txt || true
          if [ -f dist/Harf.zip ]; then
            ls -l dist/Harf.zip > ci-out/release.txt
            rm -rf build/unzipped && mkdir -p build/unzipped
            ditto -x -k dist/Harf.zip build/unzipped
            codesign -dv build/unzipped/Harf.app >> ci-out/release.txt 2>&1 || true
            lipo -info build/unzipped/Harf.app/Contents/MacOS/Harf >> ci-out/release.txt 2>&1 || true
            set +e
            build/unzipped/Harf.app/Contents/MacOS/Harf --render-assets ci-out/renders > ci-out/render.log 2>&1
            echo "render-exit=$?" >> ci-out/release.txt
          else
            echo "dist/Harf.zip missing" > ci-out/release.txt
          fi
      - name: Publish outputs
        if: always()
        run: |
          git config user.name "harf-devloop"
          git config user.email "devloop@users.noreply.github.com"
          git checkout -B xfer-harf-out
          git add -f ci-out
          git commit -q -m "devloop outputs" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" xfer-harf-out
