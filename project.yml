name: Harf
options:
  bundleIdPrefix: io.github.mohammadhadijavidi
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: NO
targets:
  HarfCore:
    type: framework
    platform: macOS
    sources:
      - path: HarfCore/Sources
      - path: HarfCore/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mohammadhadijavidi.HarfCore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"
  Harf:
    type: application
    platform: macOS
    sources:
      - path: HarfApp
    dependencies:
      - target: HarfCore
        embed: true
      - sdk: Carbon.framework
    settings:
      base:
        PRODUCT_NAME: Harf
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mohammadhadijavidi.Harf
        INFOPLIST_FILE: HarfApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"
        COMBINE_HIDPI_IMAGES: YES
  HarfCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HarfCoreTests
    dependencies:
      - target: HarfCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mohammadhadijavidi.HarfCoreTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Harf:
    build:
      targets:
        Harf: all
        HarfCore: all
        HarfCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - HarfCoreTests
    archive:
      config: Release
